<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pierre Feuille Ciseaux - Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/pfc.css">
</head>
<body>

  <div class="borne">
    <div class="ecran">
      <div class="scanlines"></div>

      <h1 class="titre-neon">PIERRE • FEUILLE • CISEAUX</h1>
      <p class="sous-titre">— ARCADE EDITION —</p>

      <div class="tableau-scores">
        <div class="bloc-score">
          <span class="etiquette">TOI</span>
          <span class="valeur-score" id="score-joueur">0</span>
        </div>
        <div class="bloc-score">
          <span class="etiquette">MACHINE</span>
          <span class="valeur-score" id="score-machine">0</span>
        </div>
      </div>

      <div class="arene">
        <div class="combattant">
          <p>TOI</p>
          <div class="main" id="main-joueur">✊</div>
        </div>

        <div class="badge-central" id="badge-central">VS</div>

        <div class="combattant">
          <p>MACHINE</p>
          <div class="main" id="main-machine">✊</div>
        </div>
      </div>

      <p class="message" id="message">Choisis ton arme !</p>

      <div class="boutons-choix">
        <button class="bouton-arcade bouton-pierre" data-choix="pierre">
          <span class="emoji-bouton">✊</span>
          PIERRE
        </button>
        <button class="bouton-arcade bouton-feuille" data-choix="feuille">
          <span class="emoji-bouton">✋</span>
          FEUILLE
        </button>
        <button class="bouton-arcade bouton-ciseaux" data-choix="ciseaux">
          <span class="emoji-bouton">✌️</span>
          CISEAUX
        </button>
      </div>

      <button class="bouton-reset" id="bouton-reset">↺ Réinitialiser le score</button>

    </div>
  </div>

  <script src="../scripts/pfc.js"></script>
</body>
</html>
